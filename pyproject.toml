[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leapp"
version = "0.2.0"
description = "LEAPP - Lightweight Export Annotations for Policy Pipelines: A Python package for tracing and exporting computational graphs from PyTorch code"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Frank Lai", email = "frlai@nvidia.com"}
]
maintainers = [
    {name = "Frank Lai", email = "frlai@nvidia.com"}
]
keywords = ["machine-learning", "pytorch", "robotics", "policy-pipelines", "graph-export"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"
dependencies = [
    "torch>=2.5.0",
    "matplotlib>=3.5.0",
    "networkx>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
    "mypy",
]

[project.urls]
Homepage = "https://gitlab-master.nvidia.com/frlai/leapp"
Repository = "https://gitlab-master.nvidia.com/frlai/leapp"
Issues = "https://gitlab-master.nvidia.com/frlai/leapp/-/issues"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
# Automatically find packages in the current directory
where = ["."]
include = ["leapp*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
# Include all files specified in MANIFEST.in
"*" = ["*.md", "*.txt", "LICENSE"]
"leapp" = ["*.py"]
