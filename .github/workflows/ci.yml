# Run CI tests on pull requests.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Ruff formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff==0.17.1
      - name: Check formatting
        run: ruff format --check .

  test:
    name: ${{ matrix.name }}
    runs-on: [self-hosted, gpu]
    container:
      image: nvidia/cuda:${{ matrix.cuda-version }}-devel-ubuntu24.04
      options: --gpus all
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: min environment
            python-version: "3.10"
            torch-version: "2.7.0+cu128"
            torch-index: cu128
            cuda-version: "12.8.1"
            warp-extra: warp-cu12
          # Python 3.15 is blocked by ONNX Runtime wheel availability.
          - name: max environment
            python-version: "3.14"
            torch-version: "2.15.0+cu132"
            torch-index: cu132
            cuda-version: "13.2.1"
            warp-extra: warp-cu13

    steps:
      # The CUDA devel image is minimal; checkout needs git and git-lfs.
      - name: Install container dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git git-lfs ca-certificates

      - uses: actions/checkout@v4
        with:
          lfs: true

      # No pip cache: HOME on the self-hosted runner is not writable by the job.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install pinned PyTorch
        run: >-
          python -m pip install "torch==${{ matrix.torch-version }}"
          --index-url https://download.pytorch.org/whl/${{ matrix.torch-index }}

      # Visualization modules ship with leapp; gated deps install on 3.11+.
      - name: Install package and test dependencies
        run: >-
          python -m pip install -e ".[dev,test,${{ matrix.warp-extra }}]"
          "torch==${{ matrix.torch-version }}" cmake ninja

      - name: Build Warp runtime
        run: >-
          leapp-build-warp-runtime --build-dir
          leapp/leapp_graph/custom_operator_registry/warp_operator/runtime/build

      - name: Run pytest
        env:
          CMAKE_GENERATOR: Ninja
        run: pytest tests/ packages/leapp-visualization/tests/ -v --durations=30

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies for pyenchant
        run: sudo apt-get update && sudo apt-get install -y enchant-2

      - name: Install doc dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Build HTML (strict)
        run: python -m sphinx -b html -W --keep-going docs/source docs/build/html

      - name: Spell check
        run: python -m sphinx -b spelling -W --keep-going docs/source docs/build/spelling

      - name: Link check
        run: python -m sphinx -b linkcheck docs/source docs/build/linkcheck
