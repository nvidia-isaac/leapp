# Run CI tests on pull requests.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # Visualization modules ship with leapp; gated deps install on 3.11+.
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,test]"

      - name: Run pytest
        run: pytest tests/ packages/leapp-visualization/tests/ -v

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies for pyenchant
        run: sudo apt-get update && sudo apt-get install -y enchant-2

      - name: Install doc dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Build HTML (strict)
        run: python -m sphinx -b html -W --keep-going docs/source docs/build/html

      - name: Spell check
        run: python -m sphinx -b spelling -W --keep-going docs/source docs/build/spelling

      - name: Link check
        run: python -m sphinx -b linkcheck docs/source docs/build/linkcheck
