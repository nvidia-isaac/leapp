# Schema-1.3 example adapted from generated_configs.rst and the C++ bundle test.
# Artifacts are deliberately opaque test bytes, never executable models.
models:
  z_observation:
    inputs:
    - name: joint_pos
      dtype: float32
      shape: [3]
      type: tensor
      kind: state/joint/position
      element_names: [[hip, knee, ankle]]
      coordinate_frame: robot
    outputs:
    - {name: features, dtype: float32, shape: [3], type: tensor}
    parameters:
      backend: jit
      model_path: model.bin
      md5sum: 900150983cd24fb0d6963f7d28e17f72
      sha256sum: ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad
      warp_segments: 0
      custom_options: {device: cpu, flags: [one, two]}
  a_policy:
    inputs:
    - {name: features, dtype: float32, shape: '[3]', type: tensor}
    - {name: state, dtype: float32, shape: [3], type: tensor}
    outputs:
    - name: actions
      dtype: float32
      shape: [3]
      type: tensor
      kind: target/joint/position
      element_names: [__temporal_axis__]
      temporal_period_ms: 100
    - {name: next_state, dtype: float32, shape: [3], type: tensor}
    parameters:
      backend: pt2
      model_path: model.bin
      md5sum: 900150983cd24fb0d6963f7d28e17f72
      sha256sum: ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad
pipeline:
  data_flow:
    z_observation/features: [a_policy/features]
  feedback_flow:
    a_policy/next_state: [a_policy/state]
  inputs: {z_observation: [joint_pos]}
  outputs: {a_policy: [next_state, actions], z_observation: [features]}
  configs: {frequency: 50, project: {label: robot}}
system information:
  leapp config version: '1.3'
  leapp version: 0.7.1
  torch version: test-fixture
