[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "leapp-runtime"
version = "0.1.0"
requires-python = ">=3.10"
description = "Synchronous LEAPP inference through Triton"
license = "Apache-2.0"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.maturin]
python-source = "python"
module-name = "leapp_runtime._native"
