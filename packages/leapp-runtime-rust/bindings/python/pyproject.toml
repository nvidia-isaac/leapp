[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "leapp-runtime"
version = "0.1.0"
requires-python = ">=3.10"
description = "Synchronous LEAPP inference through native backends or Triton"
license = "Apache-2.0"
license-files = ["LICENSE-LEAPP"]
readme = "README.md"
dependencies = ["numpy>=1.26"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://nvidia-isaac.github.io/leapp/"
Repository = "https://github.com/nvidia-isaac/leapp"
Issues = "https://github.com/nvidia-isaac/leapp/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.maturin]
python-source = "python"
module-name = "lrt._native"
