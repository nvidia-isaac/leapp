[package]
name = "leapp-runtime-python"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
leapp-runtime-bindings = { path = "../common" }
leapp-runtime = { path = "../..", features = ["triton"] }
leapp-triton = { path = "../../src/adapter/triton" }
pyo3 = { version = "=0.27.2", features = ["extension-module"] }
