[workspace]
members = ["bindings/common", "bindings/python", "bindings/cxx"]
default-members = ["."]
resolver = "2"

[package]
name = "leapp-runtime"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"
publish = ["crates-io"]
description = "LEAPP bundle inspection and synchronous native or Triton execution"
repository = "https://github.com/nvidia-isaac/leapp"
homepage = "https://nvidia-isaac.github.io/leapp/"
documentation = "https://docs.rs/leapp-runtime"
readme = "README.md"
include = ["src/**", "build.rs", "Cargo.lock", "README.md", "LICENSE", "examples/*.rs", "tests/unit_tests/**", "tests/functional_tests/**", "tests/fixtures/**"]

[lib]
name = "lrt"

[dependencies]
libloading = "=0.9.0"
protobuf = "=3.7.2"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-24", "cuda", "tensorrt"] }
tempfile = "3"
anyhow = "1"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_path_to_error = "0.1"
serde_yaml_ng = "=0.10.0"
serde_json = "1"
sha2 = "0.10"
safetensors = "=0.6.2"

[build-dependencies]
protobuf-codegen = "=3.7.2"

[[test]]
name = "bundle"
path = "tests/unit_tests/bundle.rs"

[[test]]
name = "dlpack"
path = "tests/unit_tests/dlpack.rs"
