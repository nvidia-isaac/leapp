[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isaac_deploy_trt"
version = "0.1.0"
description = "GraphSurgeon ONNX rewrites to make models TensorRT-parseable"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "onnx>=1.16.0",
    "onnx-graphsurgeon>=0.5.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest"]
ort = ["onnxruntime>=1.20.0"]

[project.scripts]
isaac_deploy_trt = "isaac_deploy_trt.cli:main"
generate-tensorrt-supported-layers = "isaac_deploy_trt.generate_cmd:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
