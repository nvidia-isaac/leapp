default:
  image: python:3.12
  cache:
    paths:
    - .cache/pip
  before_script:
  - python --version ; pip --version  # For debugging
  - pip install virtualenv
  - virtualenv venv
  - source venv/bin/activate
  - pip install build twine

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task

stages:
  - build
  - test
  - deploy
  - sonarqube

.sonarqube_rules: &sonarqube_rules
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'main'

build-job:
  stage: build
  script:
    - python -m build --wheel
  artifacts:
    paths:
      - dist/

unit-test-job:
  stage: test
  image: nvcr.io/nvidia/pytorch:24.12-py3
  tags:
    - gpu
    - isaac
  variables:
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
  before_script:
    - python --version ; pip --version
  script:
    - pip install pytest
    - pip install dist/*.whl
    - |
      export CUDA_VISIBLE_DEVICES="$(python - <<'PY'
      import os
      import subprocess
      import sys

      try:
          uuids = subprocess.check_output(
              ["nvidia-smi", "--query-gpu=uuid", "--format=csv,noheader"],
              text=True,
          ).strip().splitlines()
      except Exception as exc:
          print(f"Failed to query GPUs: {exc}", file=sys.stderr)
          sys.exit(1)

      for uuid in uuids:
          env = os.environ.copy()
          env["CUDA_VISIBLE_DEVICES"] = uuid
          result = subprocess.run(
              [
                  sys.executable,
                  "-c",
                  (
                      "import torch; "
                      "assert torch.cuda.is_available(); "
                      "assert torch.cuda.device_count() == 1; "
                      "x = torch.empty(1, device='cuda'); "
                      "torch.cuda.synchronize(); "
                      "print(torch.cuda.get_device_name(0))"
                  ),
              ],
              env=env,
              text=True,
              capture_output=True,
          )
          if result.returncode == 0:
              print(uuid)
              sys.exit(0)

          print(f"Rejecting GPU {uuid}", file=sys.stderr)
          if result.stderr:
              print(result.stderr, file=sys.stderr)

      print("No usable CUDA GPU found", file=sys.stderr)
      sys.exit(1)
      PY
      )"
    - echo "Using CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES}"
    - pytest

deploy-job:
  stage: deploy
  script:
  - TWINE_PASSWORD=${CI_JOB_TOKEN} TWINE_USERNAME=gitlab-ci-token python -m twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/*
  rules:
  - if: $CI_COMMIT_TAG

build-sonar:
  stage: sonarqube
  <<: *sonarqube_rules
  needs: []
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [""]
  before_script: []
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/
  script:
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}"
  allow_failure: true

sonarqube-vulnerability-report:
  stage: sonarqube
  <<: *sonarqube_rules
  needs: [build-sonar]
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [""]
  before_script: []
  script:
    - 'curl -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/issues/gitlab_sast_export?projectKey=TEGRASW_Isaac_Isaac_leapp&branch=${CI_COMMIT_BRANCH}&pullRequest=${CI_MERGE_REQUEST_IID}" -o gl-sast-sonar-report.json'
  allow_failure: true
  artifacts:
    expire_in: 1 day
    reports:
      sast: gl-sast-sonar-report.json